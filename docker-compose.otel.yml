# Usage: docker compose -f docker-compose.otel.yml up --build
# Grafana: http://localhost:3000 (anonymous admin)
services:
  server:
    build:
      context: .
      args:
        OPENTELEMETRY_JAVA_AGENT_VERSION: "2.32.0"
    ports:
      - "8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_JAVAAGENT_CONFIGURATION_FILE: /app/otel/agent.properties
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    volumes:
      - ./otel/agent.properties:/app/otel/agent.properties:ro
    depends_on:
      - otel-lgtm
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "${LGTM_GRAFANA_PORT:-3000}:3000"
      - "${LGTM_OTLP_GRPC_PORT:-4317}:4317"
      - "${LGTM_OTLP_HTTP_PORT:-4318}:4318"
    # To drop the agent's HTTP duration histogram before Prometheus stores it, uncomment the
    # OTELCOL_EXTRA_ARGS and otelcol-filter.yaml lines. The filter is in otel/otelcol-filter.yaml.
    # environment:
    #   OTELCOL_EXTRA_ARGS: --config=file:/otel-lgtm/otelcol-filter.yaml
    volumes:
      - ./otel/grafana/dashboards:/otel-lgtm/dashboards:ro
      - ./otel/grafana/provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards:ro
      # - ./otel/otelcol-filter.yaml:/otel-lgtm/otelcol-filter.yaml:ro
