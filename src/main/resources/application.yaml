server:
  port: 8083
spring:
  main:
    allow-circular-references: true
  flyway:
    enabled: false
  datasource:
    url: 'jdbc:h2:file:./target/database/h2-davincipct'
    username: sa
    password: null
    driverClassName: org.h2.Driver
management:
  endpoints:
    web:
      exposure:
        include: 'health,prometheus'
hapi:
  fhir:
    fhir_version: R4
    # Spring scans this package for the PCT providers, interceptors and the data initializer.
    custom-bean-packages: com.lantanagroup
    # enforce_referential_integrity_on_delete: false
    # enforce_referential_integrity_on_write: false
    cors:
      allow_Credentials: true
      # These are allowed_origin patterns, see: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/cors/CorsConfiguration.html#setAllowedOriginPatterns-java.util.List-
      allowed_origin:
        - '*'
    implementationguides:
      hl_7_fhir_us_davinci_pct:
        installMode: STORE_AND_INSTALL
        packageUrl: https://build.fhir.org/ig/HL7/davinci-pct/package.tgz
        name: hl7.fhir.us.davinci-pct
        version: 2.0.1
        fetchDependencies: false
        reloadExisting: false
      uscore:
        url: http://hl7.org/fhir/us/core/STU7/package.tgz
        name: hl7.fhir.us.core
        version: 7.0.0
      hrex:
        url: http://hl7.org/fhir/us/davinci-hrex/package.tgz
        name: hl7.fhir.us.davinci-hrex
        version: 1.0.0
    allow_external_references: true
    subscription:
      websocket_enabled: true
      resthook_enabled: true
    allowed_bundle_types: COLLECTION,DOCUMENT,MESSAGE,TRANSACTION,TRANSACTIONRESPONSE,BATCH,BATCHRESPONSE,HISTORY,SEARCHSET
    #   # Search coordinator thread pool sizes
    #   search-coord-core-pool-size: 20
    #   search-coord-max-pool-size: 100
    #   search-coord-queue-capacity: 200

initialData:
  - ri_resources
